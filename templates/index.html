<!DOCTYPE html>
<html lang="en">
<head>
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav>
        <h2>EMS</h2>
        <ul>
            <li><a href="/">Dashboard</a></li>
            <li><a href="/employees">Employees</a></li>
